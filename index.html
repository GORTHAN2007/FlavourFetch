<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%23ffffff'%3E%3Cpath d='M0 192c0-35.3 28.7-64 64-64c.5 0 1.1 0 1.6 0C73 91.5 105.3 64 144 64c15 0 29 4.1 40.9 11.2C198.2 49.6 225.1 32 256 32s57.8 17.6 71.1 43.2C339 68.1 353 64 368 64c38.7 0 71 27.5 78.4 64c.5 0 1.1 0 1.6 0c35.3 0 64 28.7 64 64c0 11.7-3.1 22.6-8.6 32L8.6 224C3.1 214.6 0 203.7 0 192zm0 91.4C0 268.3 12.3 256 27.4 256l457.1 0c15.1 0 27.4 12.3 27.4 27.4c0 70.5-44.4 130.7-106.7 154.1L403.5 452c-2 16-15.6 28-31.8 28l-231.5 0c-16.1 0-29.8-12-31.8-28l-1.8-14.4C44.4 414.1 0 353.9 0 283.4z'/%3E%3C/svg%3E" />
  <title>FlavourFetch</title>
</head>
<body>
  <nav class="navbar">
    <div class="navlinks">
      <a href="index.html" class="logo"><span><i class="fa-solid fa-bowl-food"></i></span>  FlavourFetch.</a>
      <span class="message">Fetch the flavour in your fridge.</span>
    </div>
  </nav>

  <header id="hero-section" class="hero-section">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">What's in your fridge?</h1>
      <p class="hero-subtitle">
        Type your main ingredient, and let's start cooking something Delicious!
      </p>
      <div class="search-container">
        <input type="text" id="ingredient-input" placeholder="E.g. chicken, garlic, potatoes..."
          aria-label="Ingredient Search" />
        <button id="search-btn">Discover</button>
      </div>
      <p id="error-message" class="error-msg hidden">
        Please enter an ingredient.
      </p>
    </div>
  </header>

  <main id="main-content" class="container">
       <div id="results-section" class="hidden">
           <h2 id="results-title" class="section-title">Recipes found</h2>
           <div id="recipe-grid" class="recipe-grid">

           </div>
          </div>
       <div id="recipe-detail-section" class="hidden">
           <button id="back-btn" class="back-btn">← Back to search</button>
           <div id="recipe-detail-container" class="recipe-detail-container"></div>
       </div>
   </main>

  <footer class="site-footer">
    <p>Developed by <strong>ARJU SRIVASTAV</strong></p>
    <div class="social-links">
      <a href="https://github.com/GORTHAN2007" target="_blank" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
      <a href="https://www.linkedin.com/in/arjusrivastav" target="_blank" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
